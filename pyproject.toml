[project]
name = "sketch-harness"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "agent-engine-sdk-memory>=0.11.8",
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "openai>=3.28.0",
    "pymongo>=4.18.3",
    "python-dotenv>=1.2.4",
    "raindrop-ai>=0.0.75",
    "uvicorn[standard]>=0.54.0",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
