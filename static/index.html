<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DrawTalk Harness</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>DrawTalk Harness</h1>
    <span class="project">project <b id="project-name"></b></span>
    <div class="modes" role="group" aria-label="Pen mode">
      <button id="mode-ink" class="on" title="Draw characters (I)">✏️ Ink</button>
      <button id="mode-motion" title="Draw motion paths (M)">➰ Motion</button>
    </div>
    <span id="status" class="status"></span>
  </header>

  <main>
    <section class="stage">
      <svg id="canvas" viewBox="0 0 1000 600" aria-label="Canvas">
        <g id="paths-layer"></g>
        <g id="entities-layer"></g>
        <g id="labels-layer"></g>
        <g id="ink-layer"></g>
        <g id="fx-layer"></g>
      </svg>

      <form id="name-form" class="bar">
        <input id="name-input" placeholder="Name the ink you drew (e.g. hare) and press Enter" autocomplete="off">
        <button type="submit">Make character</button>
        <button type="button" id="clear-ink" title="Discard ink and motion strokes (Esc)">Clear</button>
      </form>

      <form id="command-form" class="bar command">
        <input id="command-input" placeholder="Say what happens, e.g. “the hare and the tortoise race to the tree”" autocomplete="off">
        <button type="submit" id="send">Animate ▶</button>
      </form>

      <div class="scenes">
        <div id="scene-strip"></div>
        <button id="new-scene" title="New scene continues from the current end state">＋ scene</button>
        <button id="play-scene">▶ Play scene</button>
        <button id="play-story">▶▶ Play story</button>
      </div>
    </section>

    <aside>
      <section>
        <h2>Clips <small>(this scene)</small></h2>
        <ol id="clip-list"></ol>
      </section>
      <section>
        <h2>Why <small>(last command)</small></h2>
        <div id="trace" class="trace muted">Nothing yet.</div>
      </section>
      <section>
        <h2>Behavior library</h2>
        <ul id="behavior-list"></ul>
      </section>
    </aside>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
