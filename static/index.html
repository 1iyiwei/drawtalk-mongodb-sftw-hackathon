<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DrawTalk Harness</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>DrawTalk Harness</h1>
    <label class="project">project <select id="project-select" title="Switch story"></select></label>
    <button id="show-learning" title="Jump to the learning curve and history">📈 Learning</button>
    <div class="modes" role="group" aria-label="Pen mode">
      <button id="mode-ink" class="on" title="Draw characters (I)">✏️ Ink</button>
      <button id="mode-motion" title="Draw a path for a character to follow (P)">➰ Path</button>
      <button id="mode-gesture" title="Draw a gesture on a character: a drawn word for a behavior (G)">✳️ Gesture</button>
      <button id="mode-erase" title="Lasso to erase (E)">🧽 Erase</button>
    </div>
    <span id="status" class="status"></span>
  </header>

  <main>
    <section class="stage">
      <svg id="canvas" viewBox="0 0 1000 600" aria-label="Canvas">
        <g id="paths-layer"></g>
        <g id="entities-layer"></g>
        <g id="labels-layer"></g>
        <g id="ink-layer"></g>
        <g id="fx-layer"></g>
      </svg>

      <form id="name-form" class="bar">
        <input id="name-input" placeholder="Name the ink you drew (e.g. hare) and press Enter" autocomplete="off">
        <button type="submit">Make character</button>
        <button type="button" id="clear-ink" title="Discard unsaved ink and path strokes (Esc)">Clear</button>
      </form>

      <div id="proposal" class="proposal" hidden></div>

      <form id="command-form" class="bar command">
        <input id="command-input" placeholder="Say what happens (with a path or gesture, or alone), e.g. “the hare and the tortoise race to the tree”" autocomplete="off">
        <button type="submit" id="send">Animate ▶</button>
      </form>

      <div class="scenes">
        <div id="scene-strip"></div>
        <button id="new-scene" title="New scene continues from the current end state">＋ scene</button>
        <button id="play-scene">▶ Play scene</button>
        <button id="play-story">▶▶ Play story</button>
      </div>
    </section>

    <aside>
      <section>
        <h2>Characters <small>(this scene)</small></h2>
        <ul id="entity-list" class="plain"></ul>
      </section>
      <section>
        <h2>Clips <small>(this scene)</small> <button id="clear-clips" class="mini" title="Remove all clips in this scene">Clear clips</button></h2>
        <ol id="clip-list"></ol>
      </section>
      <section>
        <h2>Why <small>(last command)</small></h2>
        <div id="trace" class="trace muted">Nothing yet.</div>
      </section>
      <section class="viz-root">
        <h2>Harness learning</h2>
        <div id="tiles" class="tiles"></div>
        <div id="curve" class="curve"></div>
        <details id="history-box"><summary>History: what the harness changed about itself</summary><ol id="history"></ol></details>
      </section>
      <section>
        <h2>Behavior library</h2>
        <ul id="behavior-list"></ul>
      </section>
    </aside>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
